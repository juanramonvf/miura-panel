name: Miura Pages after immutable release

on:
  workflow_run:
    workflows: ["Miura immutable release"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  verify-release:
    name: Verify successful official immutable tag release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.verify.outputs.release_tag }}
    steps:
      - name: Checkout verifier from the default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate triggering run, event, workflow and tag target
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/validate_release_workflow_run.py

      - name: Verify immutable release and all asset hashes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIURA_RELEASE_TAG: ${{ steps.verify.outputs.release_tag }}
        run: python3 scripts/release/verify_published_release.py juanramonvf/miura-panel "$MIURA_RELEASE_TAG"

  build-pages:
    name: Build Pages feeds from published immutable releases
    needs: verify-release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feed builder from the default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Build the non-downgrading Pages manifests
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/build_pages_manifest.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/miura-pages

  deploy-pages:
    name: Deploy stable feed to protected GitHub Pages environment
    needs: build-pages
    runs-on: ubuntu-24.04
    concurrency:
      group: miura-pages-stable-manifest
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
