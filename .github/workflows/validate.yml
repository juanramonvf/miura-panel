name: Miura validation

on:
  workflow_call:
    inputs: {}

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  tests-and-package:
    name: Tests, package, SHA256, payload, demo
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Python test dependency
        run: python -m pip install --disable-pip-version-check psutil

      - name: Compile Python and check shell syntax
        run: |
          python -m compileall -q .
          for file in ./*.sh; do bash -n "$file"; done

      - name: Validate release tag source when running on a tag
        if: github.ref_type == 'tag'
        env:
          EVENT_CREATED: ${{ github.event.created }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          [[ "$EVENT_CREATED" == true ]] || { echo 'A release workflow only accepts a newly created tag' >&2; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Invalid stable semver tag' >&2; exit 1; }
          VERSION="$(python -c 'import json; print(json.load(open("version.json"))["version"])')"
          [[ "$RELEASE_TAG" == "v$VERSION" ]] || { echo "Tag $RELEASE_TAG and version.json $VERSION differ" >&2; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo 'Release tag is not reachable from origin/main; candidate-only commits cannot publish' >&2
            exit 1
          }

      - name: Test checked-in candidate artifacts
        if: contains(fromJSON('["refs/heads/development/v1.0.35-candidate","refs/heads/development/v1.0.36-candidate","refs/heads/development/v1.0.37-candidate","refs/heads/development/v1.0.38-candidate","refs/heads/development/v1.0.39-candidate"]'), github.ref)
        run: |
          set +e
          python -m unittest discover -s tests -v > "$RUNNER_TEMP/candidate-tests.log" 2>&1
          test_status=$?
          cat "$RUNNER_TEMP/candidate-tests.log"
          if [[ "$test_status" -ne 0 ]]; then
            tail -n 40 "$RUNNER_TEMP/candidate-tests.log" | while IFS= read -r line; do
              printf '::error title=Candidate test output::%s\n' "$line"
            done
            exit "$test_status"
          fi

      - name: Build and exercise package for this version
        env:
          MIURA_RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          VERSION="${MIURA_RELEASE_VERSION#v}"
          if [[ -z "$VERSION" ]]; then VERSION="$(python -c 'import json; print(json.load(open("version.json"))["version"])')"; fi
          mkdir -p "$RUNNER_TEMP/miura-release-package"
          python scripts/release/package_release.py "$VERSION" "$RUNNER_TEMP/miura-release-package"

      - name: Test generated package with release gates
        env:
          MIURA_RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          VERSION="${MIURA_RELEASE_VERSION#v}"
          if [[ -z "$VERSION" ]]; then VERSION="$(python -c 'import json; print(json.load(open("version.json"))["version"])')"; fi
          export MIURA_INSTALLER_PATH="$RUNNER_TEMP/miura-release-package/install-spanish-empire-panel-v${VERSION}.sh"
          export MIURA_MANIFEST_PATH="$RUNNER_TEMP/miura-release-package/miura-panel-update-manifest.json"
          python -m unittest discover -s tests -v

      - name: Upload validated release package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: miura-release-package
          path: ${{ runner.temp }}/miura-release-package/
          if-no-files-found: error
          overwrite: true
          retention-days: 2

  codeql:
    name: CodeQL security audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: python
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
