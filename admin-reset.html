<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="/assets/sep-logo.png"><title>Recuperar acceso · Miura Panel</title><style>:root{color-scheme:dark}body{background:#0b0f16;color:#edf4ff;font:15px system-ui;min-height:100vh;display:grid;place-items:center}.card{width:min(440px,92vw);background:#151b28;border:1px solid #36445c;border-radius:13px;padding:24px;box-sizing:border-box}input,button{display:block;width:100%;padding:12px;margin-top:14px;box-sizing:border-box;border-radius:8px}input{background:#0b1522;color:#fff;border:1px solid #546985}button{background:#2362a6;color:#fff;border:0;cursor:pointer}a{color:#84c0ff}</style></head><body><main class="card"><h1>Recuperar contraseña</h1><p>El enlace caduca en 20 minutos y solo puede utilizarse una vez.</p><form id="f"><label>Nueva contraseña (mínimo 12 caracteres)<input id="p" type="password" required minlength="12" autocomplete="new-password"></label><label>Confirmar contraseña<input id="q" type="password" required minlength="12" autocomplete="new-password"></label><button>Cambiar contraseña</button></form><p id="msg"></p><a href="/login">Ir al acceso</a></main><script>const token=new URLSearchParams(location.search).get('token')||'';history.replaceState(null,'','/reset');document.querySelector('#f').onsubmit=async e=>{e.preventDefault();let p=document.querySelector('#p').value,q=document.querySelector('#q').value;if(p!==q){document.querySelector('#msg').textContent='Las contraseñas no coinciden';return}let r=await fetch('/api/admin/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:p})});let j=await r.json();document.querySelector('#msg').textContent=j.message||j.error||'No se pudo cambiar la contraseña';if(r.ok)document.querySelector('#f').remove()};</script></body></html>
